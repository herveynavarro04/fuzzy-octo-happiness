[project]
name = "retrieval"
version = "0.1.0"
description = "Ingesta (Docling), clientes de embeddings/VLM/reranker, índice OpenSearch y retrieve híbrido"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "pydantic>=2.9,<3",
    "httpx==0.27.2",
    "numpy==2.1.3",
    "opensearch-py==2.7.1",
    "redis==5.2.0",
    # Docling is optional — the ingest falls back to a fake chunker if it
    # cannot import. Pin loose so Miguel can install a newer wheel without
    # fighting the resolver. In the API container we install it separately.
    "huggingface_hub>=0.26,<2.5",
]

[project.scripts]
rag-ingest = "retrieval.ingest:main"

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]

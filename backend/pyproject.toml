[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend + Pydantic AI agent"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "retrieval",
    "pydantic>=2.9,<3",
    "pydantic-ai-slim[openai]==0.4.11",
    "opentelemetry-api==1.28.0",
    "opentelemetry-sdk==1.28.0",
    "importlib-metadata<=8.5.0,>=6.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "asyncpg==0.30.0",
    "redis==5.2.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
]

[tool.uv.sources]
contracts = { workspace = true }
retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
